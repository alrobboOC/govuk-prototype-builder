name: Sync upstream builder

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-builder
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'alrobboOC/govuk-prototype-builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read upstream code
        run: |
          git fetch --no-tags https://github.com/mrkwrght/govuk-prototype-builder.git main
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/builder-upstream-sha"

      - name: Mirror upstream repository and preserve local customisations
        run: |
          git restore --source=FETCH_HEAD --staged --worktree -- . \
            ':(exclude)README.md' \
            ':(exclude)package.json' \
            ':(exclude).npmrc' \
            ':(exclude)scripts/open-builder.js' \
            ':(exclude)scripts/start-dev.js' \
            ':(exclude).github/workflows/sync-upstream.yml'

      - name: Commit updates to this repository
        run: |
          if git diff --cached --quiet; then
            echo 'Repository already matches upstream, apart from preserved customisations.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          upstream_sha=$(cat "$RUNNER_TEMP/builder-upstream-sha")
          git commit -m "Sync repository from upstream ${upstream_sha:0:7}"
          git push origin HEAD:main
