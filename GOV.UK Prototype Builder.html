<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOV.UK Prototype Builder</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f2f1;--pn:#fff;--ink:#0b0c0c;--mut:#505a5f;--ln:#b1b4b6;--bl:#1d70b8;--fc:#ffdd00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f20;--pn:#2a2d2e;--ink:#f3f2f1;--mut:#b1b4b6;--ln:#505a5f;--bl:#5694ca}}
:root[data-theme="dark"]{--bg:#1d1f20;--pn:#2a2d2e;--ink:#f3f2f1;--mut:#b1b4b6;--ln:#505a5f;--bl:#5694ca}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Arial,Helvetica,sans-serif}
header{background:#0b0c0c;color:#fff;padding:10px 16px;display:flex;gap:16px;align-items:center;border-bottom:10px solid var(--bl);flex-wrap:wrap}
header b{font-size:20px}header span{color:#b1b4b6;font-size:14px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;gap:16px;padding:16px;align-items:start}
@media(max-width:1000px){.app{grid-template-columns:1fr}}
.col{background:var(--pn);border:1px solid var(--ln);padding:12px}
h2{font-size:16px;margin:12px 0 6px}h2:first-child{margin-top:0}
.pal{border:1px solid var(--ln);padding:8px 10px;margin:0 0 6px;cursor:grab;background:var(--pn);font-weight:700;user-select:none}
.pal:hover{border-color:var(--bl);color:var(--bl)}
.pal:focus,.btn:focus,.tab:focus,.it:focus,input:focus,textarea:focus,select:focus{outline:3px solid var(--fc);outline-offset:0}
.hint{color:var(--mut);font-size:14px}
#cv{min-height:420px;padding:0}
.page{background:#fff;color:#0b0c0c;min-height:420px;padding:24px 20px 40px}
.page .in{max-width:640px}
.it{position:relative;cursor:grab;border:2px solid transparent;margin:0 -6px;padding:0 4px}
.it:hover{border-color:#b1b4b6}.it.sel{border-color:var(--bl)}
.it .pv{pointer-events:none}
.it.dropb:before,#cv.drope .page:after{content:"";display:block;height:4px;background:var(--bl);margin:0 -4px}
.it.dropb:before{position:absolute;top:-4px;left:0;right:0}
#cv.drope .page:after{margin-top:8px}
.empty{color:#505a5f;border:2px dashed #b1b4b6;padding:40px 16px;text-align:center}
.tabs{display:flex;border-bottom:1px solid var(--ln);margin:-12px -12px 12px}
.tab{flex:1;padding:10px 4px;background:none;border:0;border-bottom:4px solid transparent;color:var(--ink);font:700 14px Arial,sans-serif;cursor:pointer}
.tab[aria-selected=true]{border-bottom-color:var(--bl);color:var(--bl)}
label.f{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
.fld{width:100%;padding:6px;border:2px solid var(--ink);background:var(--pn);color:var(--ink);font:16px Arial,sans-serif;border-radius:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--bl);color:#fff;border:0;padding:7px 12px;font:700 14px Arial,sans-serif;cursor:pointer}
.btn.s{background:var(--pn);color:var(--ink);border:2px solid var(--ln)}
.btn.d{background:#d4351c;color:#fff}
pre,#out{width:100%;height:480px;font:12px/1.5 Consolas,Menlo,monospace;background:#0b0c0c;color:#f3f2f1;border:0;padding:10px;overflow:auto;resize:vertical}
/* GOV.UK-style preview */
.gv-h1{font:700 48px/1.1 Arial,sans-serif;margin:0 0 30px}
.govuk-heading-xl{font:700 48px/1.1 Arial,sans-serif;margin:0 0 30px}
.govuk-heading-l{font:700 36px/1.1 Arial,sans-serif;margin:0 0 20px}
.govuk-heading-m{font:700 24px/1.2 Arial,sans-serif;margin:0 0 20px}
.govuk-body{font:19px/1.3 Arial,sans-serif;margin:0 0 20px}
.govuk-inset-text{border-left:10px solid #b1b4b6;padding:15px;margin:30px 0;font-size:19px}
.govuk-warning-text{margin:30px 0;display:flex;gap:15px;align-items:center;font-size:19px}
.govuk-warning-text__icon{flex:none;width:35px;height:35px;border:3px solid #0b0c0c;border-radius:50%;text-align:center;font:700 30px/29px Arial;}
.govuk-visually-hidden{position:absolute;left:-9999px}
.govuk-button{background:#00703c;color:#fff;border:0;box-shadow:0 2px 0 #002d18;padding:8px 10px 7px;font:19px Arial,sans-serif;margin:0 0 22px}
.govuk-form-group{margin-bottom:30px}
.govuk-label{display:block;font:19px Arial;margin-bottom:5px}
.govuk-label--s,.govuk-fieldset__legend--s{font-weight:700}
.govuk-label--m,.govuk-fieldset__legend--m{font:700 24px Arial}
.govuk-fieldset{border:0;margin:0;padding:0}
.govuk-fieldset__legend{margin-bottom:15px}
.govuk-hint{color:#505a5f;font-size:19px;margin-bottom:15px}
.govuk-input,.govuk-textarea,.govuk-select{display:block;width:100%;border:2px solid #0b0c0c;padding:5px;font:19px Arial;height:40px;border-radius:0;background:#fff;color:#0b0c0c}
.govuk-textarea{height:110px}.govuk-select{width:auto;min-width:200px}
.govuk-radios__item,.govuk-checkboxes__item{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:19px}
.govuk-radios__input,.govuk-checkboxes__input{width:40px;height:40px;margin:0;border:2px solid #0b0c0c;flex:none}
.govuk-details__summary{color:#1d70b8;text-decoration:underline;font-size:19px;margin-bottom:10px;display:block}
.govuk-details__text{border-left:5px solid #b1b4b6;padding:15px;font-size:19px;margin-bottom:20px}
.govuk-notification-banner{border:5px solid #1d70b8;background:#1d70b8;margin-bottom:30px}
.govuk-notification-banner__title{color:#fff;font:700 19px Arial;margin:0;padding:2px 20px 5px}
.govuk-notification-banner__content{background:#fff;padding:20px;font-size:19px}
.govuk-notification-banner__heading{font:700 19px Arial;margin:0}
.govuk-back-link{display:inline-block;color:#0b0c0c;font-size:16px;margin:0 0 20px;padding-left:14px;border-left:0;text-decoration:underline}
.govuk-tag{display:inline-block;font:700 16px/1 Arial;text-transform:uppercase;padding:5px 8px 4px;margin-bottom:20px;color:#1d70b8;background:#d2e2f1}
.govuk-tag--grey{color:#282d30;background:#e5e6e7}.govuk-tag--green{color:#005a30;background:#cce2d8}.govuk-tag--red{color:#942514;background:#f6d7d2}.govuk-tag--yellow{color:#594d00;background:#fff7bf}
</style></head>
<body>
<header><b>GOV.UK Prototype Builder</b><span>Drag components onto the page, then copy the Nunjucks into your Prototype Kit app/views folder.</span></header>
<div class="app">
 <div class="col" id="pal" aria-label="Components"></div>
 <div class="col" id="cv"><div class="page"><div class="in" id="page"></div></div></div>
 <div class="col" id="side">
  <div class="tabs" role="tablist"><button class="tab" data-t="p">Properties</button><button class="tab" data-t="n">Nunjucks</button><button class="tab" data-t="h">HTML</button></div>
  <div id="sb"></div>
 </div>
</div>
<script>
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const q=s=>JSON.stringify(String(s));
const sl=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
const L=s=>String(s).split('\n').map(x=>x.trim()).filter(Boolean);
const lab=(t,n,z='s')=>`<label class="govuk-label govuk-label--${z}" for="${n}">${e(t)}</label>`;
const hn=(t,n)=>t?`<div id="${n}-hint" class="govuk-hint">${e(t)}</div>`:'';
const hj=t=>t?`  hint: { text: ${q(t)} },\n`:'';
const items=(o,n,ty,cls)=>L(o).map((x,i)=>`<div class="govuk-${cls}__item"><input class="govuk-${cls}__input" id="${n}-${i+1}" name="${n}" type="${ty}" value="${sl(x)}"><label class="govuk-label govuk-${cls}__label" for="${n}-${i+1}">${e(x)}</label></div>`).join('');
const itj=o=>`  items: [\n${L(o).map(x=>`    { value: ${q(sl(x))}, text: ${q(x)} }`).join(',\n')}\n  ]`;
const grp=(p,cls,ty)=>`<div class="govuk-form-group"><fieldset class="govuk-fieldset"><legend class="govuk-fieldset__legend govuk-fieldset__legend--m">${e(p.legend)}</legend>${hn(p.hint,p.name)}<div class="govuk-${cls}" data-module="govuk-${cls}">${items(p.options,p.name,ty,cls)}</div></fieldset></div>`;
const grj=(m,p)=>`{{ ${m}({\n  name: ${q(p.name)},\n  fieldset: { legend: { text: ${q(p.legend)}, classes: "govuk-fieldset__legend--m" } },\n${hj(p.hint)}${itj(p.options)}\n}) }}`;
const fld=(p,tag)=>`<div class="govuk-form-group">${lab(p.label,p.name)}${hn(p.hint,p.name)}<${tag} class="govuk-${tag}" id="${p.name}" name="${p.name}"${tag=='input'?' type="text"':''}${p.hint?` aria-describedby="${p.name}-hint"`:''}>${tag=='input'?'':'</textarea>'}</div>`;
const flj=(m,p)=>`{{ ${m}({\n  label: { text: ${q(p.label)}, classes: "govuk-label--s" },\n${hj(p.hint)}  id: ${q(p.name)},\n  name: ${q(p.name)}\n}) }}`;
const LP=['label','Label','Your answer'],NP=['name','Name (id)','field-name'],HP=['hint','Hint (optional)',''];
const C={
heading:{n:'Heading',g:'Content',p:[['text','Text','Apply for a licence'],['size','Size','l',['xl','l','m']]],h:p=>`<h1 class="govuk-heading-${p.size}">${e(p.text)}</h1>`},
paragraph:{n:'Paragraph',g:'Content',p:[['text','Text','Use this service to apply online. It takes about 10 minutes.','area']],h:p=>`<p class="govuk-body">${e(p.text)}</p>`},
inset:{n:'Inset text',g:'Content',m:['govukInsetText','inset-text'],p:[['text','Text','You can apply up to 3 months before your current licence expires.','area']],h:p=>`<div class="govuk-inset-text">${e(p.text)}</div>`,j:p=>`{{ govukInsetText({ text: ${q(p.text)} }) }}`},
warning:{n:'Warning text',g:'Content',m:['govukWarningText','warning-text'],p:[['text','Text','You could be fined if you do not apply in time.']],h:p=>`<div class="govuk-warning-text"><span class="govuk-warning-text__icon" aria-hidden="true">!</span><strong class="govuk-warning-text__text"><span class="govuk-visually-hidden">Warning</span>${e(p.text)}</strong></div>`,j:p=>`{{ govukWarningText({ text: ${q(p.text)}, iconFallbackText: "Warning" }) }}`},
notification:{n:'Notification banner',g:'Content',m:['govukNotificationBanner','notification-banner'],p:[['title','Title','Important'],['text','Text','Your application has been saved.']],h:p=>`<div class="govuk-notification-banner" role="region" aria-labelledby="govuk-notification-banner-title" data-module="govuk-notification-banner"><div class="govuk-notification-banner__header"><h2 class="govuk-notification-banner__title" id="govuk-notification-banner-title">${e(p.title)}</h2></div><div class="govuk-notification-banner__content"><p class="govuk-notification-banner__heading">${e(p.text)}</p></div></div>`,j:p=>`{{ govukNotificationBanner({\n  titleText: ${q(p.title)},\n  text: ${q(p.text)}\n}) }}`},
tag:{n:'Tag',g:'Content',m:['govukTag','tag'],p:[['text','Text','In progress'],['colour','Colour','blue',['grey','green','blue','red','yellow']]],h:p=>`<strong class="govuk-tag govuk-tag--${p.colour}">${e(p.text)}</strong>`,j:p=>`{{ govukTag({ text: ${q(p.text)}, classes: "govuk-tag--${p.colour}" }) }}`},
details:{n:'Details',g:'Content',m:['govukDetails','details'],p:[['summary','Summary','Help with nationality'],['text','Content','We need this to check your eligibility.','area']],h:p=>`<details class="govuk-details"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">${e(p.summary)}</span></summary><div class="govuk-details__text">${e(p.text)}</div></details>`,j:p=>`{{ govukDetails({\n  summaryText: ${q(p.summary)},\n  text: ${q(p.text)}\n}) }}`},
input:{n:'Text input',g:'Form',f:1,m:['govukInput','input'],p:[LP,NP,HP],h:p=>fld(p,'input'),j:p=>flj('govukInput',p)},
textarea:{n:'Textarea',g:'Form',f:1,m:['govukTextarea','textarea'],p:[['label','Label','Tell us more'],NP,HP],h:p=>fld(p,'textarea'),j:p=>flj('govukTextarea',p)},
radios:{n:'Radios',g:'Form',f:1,m:['govukRadios','radios'],p:[['legend','Question','Do you have a UK passport?'],['name','Name','passport'],HP,['options','Options (one per line)','Yes\nNo','area']],h:p=>grp(p,'radios','radio'),j:p=>grj('govukRadios',p)},
checkboxes:{n:'Checkboxes',g:'Form',f:1,m:['govukCheckboxes','checkboxes'],p:[['legend','Question','What do you need?'],['name','Name','needs'],HP,['options','Options (one per line)','Passport\nDriving licence\nBirth certificate','area']],h:p=>grp(p,'checkboxes','checkbox'),j:p=>grj('govukCheckboxes',p)},
select:{n:'Select',g:'Form',f:1,m:['govukSelect','select'],p:[['label','Label','Sort by'],['name','Name','sort'],['options','Options (one per line)','Recently updated\nRecently published\nMost views','area']],h:p=>`<div class="govuk-form-group">${lab(p.label,p.name)}<select class="govuk-select" id="${p.name}" name="${p.name}">${L(p.options).map(o=>`<option value="${sl(o)}">${e(o)}</option>`).join('')}</select></div>`,j:p=>`{{ govukSelect({\n  id: ${q(p.name)},\n  name: ${q(p.name)},\n  label: { text: ${q(p.label)}, classes: "govuk-label--s" },\n${itj(p.options)}\n}) }}`},
button:{n:'Button',g:'Form',m:['govukButton','button'],p:[['text','Text','Continue']],h:p=>`<button type="submit" class="govuk-button" data-module="govuk-button">${e(p.text)}</button>`,j:p=>`{{ govukButton({ text: ${q(p.text)} }) }}`},
back:{n:'Back link',g:'Navigation',top:1,m:['govukBackLink','back-link'],p:[['text','Text','Back'],['href','Link','javascript:history.back()']],h:p=>`<a href="${e(p.href)}" class="govuk-back-link">${e(p.text)}</a>`,j:p=>`{{ govukBackLink({ text: ${q(p.text)}, href: ${q(p.href)} }) }}`}
};
let S={items:[],sel:null,tab:'p',title:'Page title'};
try{const s=JSON.parse(localStorage.getItem('govuk-builder')||'null');if(s&&Array.isArray(s.items))S=Object.assign(S,s,{tab:'p'})}catch(_){}
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem('govuk-builder',JSON.stringify(S))}catch(_){}};
const mk=t=>{const p={};C[t].p.forEach(([k,,d])=>p[k]=d);return{t,p}};
function palette(){let h='',g='';for(const[id,c]of Object.entries(C)){if(c.g!==g){g=c.g;h+=`<h2>${g}</h2>`}h+=`<div class="pal" draggable="true" tabindex="0" role="button" data-id="${id}">${c.n}</div>`}
$('#pal').innerHTML=`<p class="hint" style="margin-top:0">Drag onto the page, or press Enter on a component.</p>`+h}
function canvas(){$('#page').innerHTML=S.items.length?S.items.map((it,i)=>`<div class="it${i===S.sel?' sel':''}" draggable="true" tabindex="0" data-i="${i}"><div class="pv">${C[it.t].h(it.p)}</div></div>`).join(''):'<div class="empty">Drag a component here to start your page</div>'}
const ind=s=>s.split('\n').map(l=>l?'    '+l:l).join('\n');
const isForm=()=>S.items.some(i=>C[i.t].f);
function nunjucks(){const m=[...new Set(S.items.filter(i=>C[i.t].m).map(i=>C[i.t].m))].map(x=>x.join('|'));
const imp=m.map(x=>{const[a,b]=x.split('|');return`{% from "govuk/components/${b}/macro.njk" import ${a} %}`}).join('\n');
const body=S.items.filter(i=>!C[i.t].top).map(i=>(C[i.t].j||C[i.t].h)(i.p)).join('\n\n');
const top=S.items.filter(i=>C[i.t].top).map(i=>C[i.t].j(i.p)).join('\n');
const inner=isForm()?`<form method="post" novalidate>\n${ind(body)}\n</form>`:body;
return`{% extends "layouts/main.html" %}\n\n${imp?imp+'\n\n':''}{% block pageTitle %}\n  ${S.title}\n{% endblock %}\n\n${top?`{% block beforeContent %}\n  ${top}\n{% endblock %}\n\n`:''}{% block content %}\n<div class="govuk-grid-row">\n  <div class="govuk-grid-column-two-thirds">\n${ind(ind(inner)).replace(/^ {4}/gm,'')}\n  </div>\n</div>\n{% endblock %}\n`}
function html(){const b=S.items.map(i=>C[i.t].h(i.p)).join('\n\n');const inner=isForm()?`<form method="post" novalidate>\n${ind(b)}\n</form>`:b;return`<div class="govuk-grid-row">\n  <div class="govuk-grid-column-two-thirds">\n${ind(inner)}\n  </div>\n</div>\n`}
function side(){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.t===S.tab))
const sb=$('#sb');if(S.tab==='p')return props(sb);code(sb)}
function code(sb){const txt=S.tab==='n'?nunjucks():html();
if(!sb.querySelector('#out')){sb.innerHTML=`<label class="f" style="margin-top:0" for="out">${S.tab==='n'?'Save as app/views/your-page.html':'Plain HTML for the page body'}</label><textarea id="out" readonly></textarea><div class="row"><button class="btn" id="cp">Copy to clipboard</button><span class="hint" id="cm" role="status"></span></div>`;$('#cp').onclick=async()=>{const o=$('#out');try{await navigator.clipboard.writeText(o.value);$('#cm').textContent='Copied'}catch(_){o.select();try{document.execCommand('copy');$('#cm').textContent='Copied'}catch(__){$('#cm').textContent='Select the text and copy it'}}}}
$('#out').value=txt}
function props(sb){const it=S.items[S.sel];
let h=`<label class="f" style="margin-top:0" for="pt">Page title</label><input class="fld" id="pt" value="${e(S.title)}">`;
if(!it){sb.innerHTML=h+`<p class="hint" style="margin-top:16px">Select a component on the page to edit its content.</p>`;$('#pt').oninput=ev=>{S.title=ev.target.value;save()};return}
h+=`<h2 style="margin-top:20px">${C[it.t].n}</h2>`;
C[it.t].p.forEach(([k,l,,ty])=>{h+=`<label class="f" for="p-${k}">${l}</label>`+(Array.isArray(ty)?`<select class="fld" id="p-${k}" data-k="${k}">${ty.map(o=>`<option${it.p[k]===o?' selected':''}>${o}</option>`).join('')}</select>`:ty==='area'?`<textarea class="fld" rows="4" id="p-${k}" data-k="${k}">${e(it.p[k])}</textarea>`:`<input class="fld" id="p-${k}" data-k="${k}" value="${e(it.p[k])}">`)});
h+=`<div class="row"><button class="btn s" data-a="up">Move up</button><button class="btn s" data-a="down">Move down</button><button class="btn s" data-a="dup">Duplicate</button><button class="btn d" data-a="del">Delete</button></div>`;
sb.innerHTML=h;$('#pt').oninput=ev=>{S.title=ev.target.value;save()}}
function all(){canvas();side();save()}
function add(id,at){const it=mk(id);const i=at==null?S.items.length:at;S.items.splice(i,0,it);S.sel=i;S.tab='p';all()}
function idxAt(y){const els=[...document.querySelectorAll('.it')];let n=0;els.forEach(el=>{const r=el.getBoundingClientRect();if(y>r.top+r.height/2)n++});return n}
function clr(){document.querySelectorAll('.dropb').forEach(x=>x.classList.remove('dropb'));$('#cv').classList.remove('drope')}
document.addEventListener('dragstart',ev=>{const p=ev.target.closest&&ev.target.closest('.pal'),i=ev.target.closest&&ev.target.closest('.it');
if(p)ev.dataTransfer.setData('text/plain','new:'+p.dataset.id);else if(i)ev.dataTransfer.setData('text/plain','mv:'+i.dataset.i);ev.dataTransfer.effectAllowed='copyMove'});
const cv=$('#cv');
cv.addEventListener('dragover',ev=>{ev.preventDefault();clr();const n=idxAt(ev.clientY),els=document.querySelectorAll('.it');if(n<els.length)els[n].classList.add('dropb');else cv.classList.add('drope')});
cv.addEventListener('dragleave',ev=>{if(!cv.contains(ev.relatedTarget))clr()});
cv.addEventListener('drop',ev=>{ev.preventDefault();const n=idxAt(ev.clientY);clr();const d=ev.dataTransfer.getData('text/plain');
if(d.startsWith('new:'))add(d.slice(4),n);else if(d.startsWith('mv:')){const f=+d.slice(3),[it]=S.items.splice(f,1);const to=n>f?n-1:n;S.items.splice(to,0,it);S.sel=to;all()}});
document.addEventListener('dragend',clr);
document.addEventListener('click',ev=>{const p=ev.target.closest('.pal');if(p)return add(p.dataset.id);
const i=ev.target.closest('.it');if(i){S.sel=+i.dataset.i;S.tab='p';return all()}
const t=ev.target.closest('.tab');if(t){S.tab=t.dataset.t;$('#sb').innerHTML='';return side()}
const a=ev.target.closest('[data-a]');if(a){const s=S.sel,I=S.items;
if(a.dataset.a==='del'){I.splice(s,1);S.sel=null}
if(a.dataset.a==='dup'){I.splice(s+1,0,JSON.parse(JSON.stringify(I[s])));S.sel=s+1}
if(a.dataset.a==='up'&&s>0){[I[s-1],I[s]]=[I[s],I[s-1]];S.sel=s-1}
if(a.dataset.a==='down'&&s<I.length-1){[I[s+1],I[s]]=[I[s],I[s+1]];S.sel=s+1}
all()}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const p=ev.target.closest&&ev.target.closest('.pal');if(p)add(p.dataset.id);const i=ev.target.closest&&ev.target.closest('.it');if(i){S.sel=+i.dataset.i;S.tab='p';all()}});
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(!k||S.sel==null)return;S.items[S.sel].p[k]=ev.target.value;canvas();save()});
palette();all();
</script></body></html>
